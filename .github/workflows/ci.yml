name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # sqlx::test creates a fresh database per test from this URL.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  # The image Railway deploys. `cargo test` builds from the full checkout, so
  # it cannot see files the Docker context leaves out (.dockerignore); this job
  # builds the real image so such a gap fails here instead of at deploy.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build the deploy image
        run: docker build --tag jiaoyi:ci .

  engineering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: test the unattended coordinator
        run: python3 -m unittest discover -s ops/engineering/tests -v
      - name: build the separate engineering image
        run: docker build -f ops/engineering/Dockerfile --tag jiaoyi-engineering:ci .
      - name: exercise worker identity and recovery mechanics in its image
        run: docker run --rm jiaoyi-engineering:ci python3 /app/smoke_image.py
