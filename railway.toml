# Railway service `jiaoyi` in project `jiaoyi_prj`.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Only inputs to the deployed Rust image restart trading. Engineering uploads
# remain separate. Keep future embedded registrations and all build inputs.
watchPatterns = [
  "/crates/**",
  "/migrations/**",
  "/config/**",
  "/.cargo/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/rust-toolchain.toml",
  "/Dockerfile",
  "/.dockerignore",
  "/railway.toml",
  "/docs/preregistration-*.md",
]

[deploy]
startCommand = "/usr/local/bin/jiaoyi"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Seconds between SIGTERM and SIGKILL (Railway's default is 0). Longer than
# the service's 10 s shutdown grace, so the recorders' final flush completes.
drainingSeconds = 15
