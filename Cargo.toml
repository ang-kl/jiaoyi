[workspace]
resolver = "2"
members = [
    "crates/jiaoyi-core",
    "crates/jiaoyi-ctrader",
    "crates/jiaoyi-store",
    "crates/jiaoyi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
jiaoyi-core = { path = "crates/jiaoyi-core" }
jiaoyi-ctrader = { path = "crates/jiaoyi-ctrader" }
jiaoyi-store = { path = "crates/jiaoyi-store" }

anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "chrono", "rust_decimal", "json"] }
static_assertions = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
webpki-roots = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
